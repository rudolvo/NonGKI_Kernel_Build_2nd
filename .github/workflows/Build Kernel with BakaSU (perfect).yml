name: Build Kernel with BakaSU (perfect)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'star'
        required: true
        default: 'star'
        type: choice
        options:
          - star
          - mars
      bakasu_ref:
        description: 'BakaSU commit（暂停前版本）'
        required: false
        default: '896e898'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  DEVICE_CODENAME: ${{ github.event.inputs.device || 'star' }}
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "zttlove/android_kernel_xiaomi_sm8350-hyperos"
  KERNEL_BRANCH: "dynamic"
  DEFCONFIG_NAME: "vendor/${{ github.event.inputs.device || 'star' }}_defconfig"
  OUTPUT_DIR: "out"
  CLANG_DIR: "${{ github.workspace }}/clang"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  KERNEL_DIR: "${{ github.workspace }}/kernel"
  BAKASU_REPO: "https://github.com/Baka-SU/BakaSU.git"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Checkout Workflow Repo (Patches)
        uses: actions/checkout@v4
        with:
          path: workflow_repo
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libelf-dev libssl-dev libncurses-dev \
            make python3 device-tree-compiler git curl xz-utils \
            ccache zip unzip zstd
          echo "正在修复 libtinfo.so.5 依赖..."
          if ! sudo apt install -y libtinfo5; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi
          if [ ! -f /lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            echo "::error::修复失败！libtinfo.so.5 仍然不存在。"
            exit 1
          else
            echo "✅ libtinfo.so.5 修复成功！"
          fi

      - name: Cache Clang 17.0.6
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-17.0.6-ubuntu-22.04

      - name: Download Clang 17.0.6 (Official Kernel Toolchain)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          curl -L --retry 3 -o clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz"
          tar -xf clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz -C ${{ env.CLANG_DIR }} --strip-components=1
          rm clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          ${{ env.CLANG_DIR }}/bin/clang --version

      - name: Clone BakaSU and apply non-GKI SELinux fixes
        run: |
          cd ${{ env.KERNEL_DIR }}
          BAKASU_REF="${{ github.event.inputs.bakasu_ref || '896e898' }}"
          echo "=== 克隆 BakaSU 并 checkout 到 $BAKASU_REF ==="
          rm -rf BakaSU_src
          git clone "${{ env.BAKASU_REPO }}" BakaSU_src
          cd BakaSU_src
          git checkout "$BAKASU_REF"
          echo "当前 HEAD: $(git log --oneline -1)"

          # ---------- SUSFS 阻断注释 ----------
          echo "=== 处理 susfs_compat.mk ==="
          MAP=$(find . -name 'susfs_compat.mk' -type f 2>/dev/null)
          if [ -n "$MAP" ]; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              sed -i '/Please wait susfs update/ s/^\([^#]\)/# \1/' "$f"
            done <<< "$MAP"
            echo "✅ susfs_compat.mk 已处理"
          else
            echo "ℹ️ 未找到 susfs_compat.mk"
          fi

          # ---------- 动态定位 selinux_hide.c ----------
          echo "=== 动态定位 selinux_hide.c ==="
          HIDE_FILE=$(find . -name 'selinux_hide.c' -type f | head -n1)
          if [ -z "$HIDE_FILE" ]; then
            echo "::error::在整个仓库中未找到 selinux_hide.c"
            exit 1
          fi
          HIDE_DIR=$(dirname "$HIDE_FILE")
          echo "✅ 找到 selinux_hide.c: $HIDE_FILE"

          # ---------- 清理错误包含与错误定义 ----------
          echo "=== 清理之前错误添加的内容 ==="
          sed -i '/#include <linux\/selinux.h>/d' "$HIDE_FILE"
          sed -i '/DEFINE_SPINLOCK(ksu_selinux_status_lock);/d' "$HIDE_FILE"
          sed -i '/EXPORT_SYMBOL(ksu_selinux_status_lock);/d' "$HIDE_FILE"
          sed -i '/EXPORT_SYMBOL(fake_state);/d' "$HIDE_FILE"
          echo "✅ 已清理"

          # ---------- 处理 ksu_selinux_status_lock：保持原类型，去掉 static ----------
          echo "=== 处理 ksu_selinux_status_lock ==="
          if grep -q 'static struct mutex \*ksu_selinux_status_lock' "$HIDE_FILE"; then
            sed -i 's/^static struct mutex \*ksu_selinux_status_lock/struct mutex *ksu_selinux_status_lock/' "$HIDE_FILE"
            echo "✅ 已将 static struct mutex * 改为全局"
          elif ! grep -q 'ksu_selinux_status_lock' "$HIDE_FILE"; then
            echo "" >> "$HIDE_FILE"
            echo "struct mutex *ksu_selinux_status_lock = NULL;" >> "$HIDE_FILE"
            echo "✅ 已追加 struct mutex * 定义"
          else
            echo "ℹ️ 已存在非 static 定义"
          fi
          if ! grep -q 'EXPORT_SYMBOL(ksu_selinux_status_lock);' "$HIDE_FILE"; then
            echo "EXPORT_SYMBOL(ksu_selinux_status_lock);" >> "$HIDE_FILE"
          fi

          # ---------- 处理 fake_state：保持原类型，去掉 static ----------
          echo "=== 处理 fake_state ==="
          if grep -q 'static struct selinux_state fake_state;' "$HIDE_FILE"; then
            sed -i 's/^static struct selinux_state fake_state;/struct selinux_state fake_state;/' "$HIDE_FILE"
            echo "✅ 已将 static fake_state 改为全局"
          elif ! grep -q 'struct selinux_state fake_state;' "$HIDE_FILE"; then
            echo "" >> "$HIDE_FILE"
            echo "struct selinux_state fake_state;" >> "$HIDE_FILE"
            echo "✅ 已追加 fake_state 定义"
          else
            echo "ℹ️ 已存在非 static 定义"
          fi
          if ! grep -q 'EXPORT_SYMBOL(fake_state);' "$HIDE_FILE"; then
            echo "EXPORT_SYMBOL(fake_state);" >> "$HIDE_FILE"
          fi

          # ---------- 向上逐层查找存在的 Makefile ----------
          echo "=== 定位包含 selinux_hide 的 Makefile ==="
          SEARCH_DIR="$HIDE_DIR"
          SELINUX_MK=""
          while [ "$SEARCH_DIR" != "." ] && [ "$SEARCH_DIR" != "/" ]; do
            if [ -f "$SEARCH_DIR/Makefile" ]; then
              SELINUX_MK="$SEARCH_DIR/Makefile"
              break
            fi
            SEARCH_DIR=$(dirname "$SEARCH_DIR")
          done
          if [ -z "$SELINUX_MK" ]; then
            echo "::error::从 $HIDE_DIR 向上未找到任何 Makefile"
            exit 1
          fi
          echo "✅ 使用 Makefile: $SELINUX_MK"

          MK_DIR=$(dirname "$SELINUX_MK")
          HIDE_REL=$(realpath --relative-to="$MK_DIR" "$HIDE_FILE")
          HIDE_OBJ="${HIDE_REL%.c}.o"
          echo "   编译对象相对路径: $HIDE_OBJ"

          # ---------- 注入兼容检测与编译规则 ----------
          echo "=== 注入 SELinux 兼容检测与编译规则 ==="
          sed -i "\\|$HIDE_OBJ|d" "$SELINUX_MK"
          printf '%s\n' \
            '' \
            '# === BakaSU non-GKI compatibility: detect selinux_state ===' \
            'ifeq ($(shell grep -q "struct selinux_state " $(srctree)/security/selinux/include/security.h; echo $$?),0)' \
            'ccflags-y += -DKSU_COMPAT_HAS_SELINUX_STATE' \
            'endif' \
            '' \
            "obj-y += $HIDE_OBJ" \
            >> "$SELINUX_MK"
          echo "✅ 已注入到 $SELINUX_MK"

          # ---------- 最终验证 ----------
          echo "=== 最终验证 ==="
          if grep -q '^struct selinux_state fake_state;' "$HIDE_FILE" && \
             grep -q 'EXPORT_SYMBOL(fake_state);' "$HIDE_FILE" && \
             grep -q '^struct mutex \*ksu_selinux_status_lock' "$HIDE_FILE" && \
             grep -q 'EXPORT_SYMBOL(ksu_selinux_status_lock);' "$HIDE_FILE" && \
             grep -q 'KSU_COMPAT_HAS_SELINUX_STATE' "$SELINUX_MK" && \
             grep -q "obj-y += $HIDE_OBJ" "$SELINUX_MK"; then
            echo "✅ 所有修复已就位"
          else
            echo "::error::修复不完整，请检查日志"
            exit 1
          fi

      - name: Manual integrate BakaSU into Kernel
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== 手动创建 seccomp_types.h ==="
          if [ ! -f "include/linux/seccomp_types.h" ]; then
            touch "include/linux/seccomp_types.h"
          fi

          echo "=== 清理旧版 KernelSU/ReSukiSU ==="
          rm -rf KernelSU drivers/kernelsu drivers/KernelSU

          echo "=== 手动集成 BakaSU ==="
          ln -sf ../BakaSU_src/kernel drivers/kernelsu
          echo "✅ 软链接: $(readlink -f drivers/kernelsu)"

          if ! grep -q "kernelsu" drivers/Makefile; then
            printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          fi

          if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            sed -i '/^endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

          echo "=== 验证集成 ==="
          if [ ! -f "drivers/kernelsu/Kconfig" ] || [ ! -f "drivers/kernelsu/Makefile" ]; then
            echo "::error::集成失败"
            exit 1
          fi

          echo "=== 导出 BakaSU 版本信息 ==="
          echo "BAKASU_COMMIT=$(cd BakaSU_src && git rev-parse --short HEAD)" >> $GITHUB_ENV
          BAKASU_VERSION=$(grep -r "versionCode" drivers/kernelsu/ 2>/dev/null | head -n1 | awk -F= '{print $2}' | tr -d ' ;' || echo 'unknown')
          echo "BAKASU_VERSION=${BAKASU_VERSION}" >> $GITHUB_ENV

          echo "=== 清理 ccache ==="
          ccache -C

          echo "=== 修复 focaltech_3680 Makefile ==="
          FOCALTECH_MAKEFILE="drivers/input/touchscreen/focaltech_3680/Makefile"
          if [ -f "$FOCALTECH_MAKEFILE" ]; then
            sed -i 's/^ \+/\t/' "$FOCALTECH_MAKEFILE"
          fi

          echo "=== 子目录警告禁用 ==="
          for entry in \
            "drivers/soc/qcom/Makefile:-Wno-unused-variable" \
            "drivers/thermal/Makefile:-Wno-fortify-source" \
            "techpack/bootinfo/Makefile:-Wno-unused-result" \
            "drivers/usb/dwc3/Makefile:-Wno-unused-label"; do
            MK="${entry%:*}"
            FLAG="${entry#*:}"
            if [ -f "$MK" ] && ! grep -q "$FLAG" "$MK"; then
              echo "ccflags-y += $FLAG" >> "$MK"
            fi
          done

          echo "=== 清理残留文件 ==="
          rm -rf ${{ env.OUTPUT_DIR }}
          rm -f .config
          rm -rf include/config include/generated
          make mrproper

          echo "=== 生成 out/.config ==="
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}
          if [ ! -f "${{ env.OUTPUT_DIR }}/.config" ]; then
            echo "::error::make defconfig 失败"
            exit 1
          fi

          echo "=== 启用 BakaSU 配置 ==="
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --disable KSU_TRACEPOINT_HOOK \
            --enable KSU_SUSFS \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SUS_MAP \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --disable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_SUS_SU \
            --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --disable HEADERS_INSTALL \
            --set-val FRAME_WARN 131072 \
            --set-str LOCALVERSION "-edwin-star-260927-qgqi"

          echo "=== 同步配置 ==="
          make O=${{ env.OUTPUT_DIR }} olddefconfig 2>&1 | tee olddefconfig.log

          if ! grep -q "CONFIG_KSU=y" ${{ env.OUTPUT_DIR }}/.config; then
            echo "::error::CONFIG_KSU 未启用"
            exit 1
          fi
          echo "✅ 配置检查通过"

      - name: Build Kernel
        working-directory: kernel
        run: |
          set +e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== 开始编译内核 ==="
          MEM_GB=$(free -g | awk '/^Mem:/{print $2}')
          if [ "$MEM_GB" -lt 8 ]; then JOBS=4; else JOBS=$(nproc); fi
          echo "=== 内存 ${MEM_GB}GB，使用 -j${JOBS} ==="

          make -j${JOBS} O=${{ env.OUTPUT_DIR }} \
               KCFLAGS="-Wno-error -Wframe-larger-than=131072 -Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-array-parameter -Wno-declaration-after-statement -Wno-sometimes-uninitialized -Wno-unused-variable -Wno-misleading-indentation -Wno-fortify-source -Wno-macro-redefined -Wno-unused-result -Wno-unused-label" \
               HOSTCFLAGS="" \
               2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "::error::编译失败，退出码 $BUILD_STATUS"
            exit 1
          fi

          if [ ! -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "::error::编译失败，未生成 Image"
            exit 1
          fi
          echo "✅ 编译成功，Image 已生成"

      - name: Package AnyKernel3
        id: package
        run: |
          set -e
          TIME=$(date +"%Y.%m.%d")
          AK3_DIR="AnyKernel3"
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $AK3_DIR
          gzip -9 -c "$IMG_PATH" > "$AK3_DIR/Image.gz"
          
          printf '%s\n' \
            '#!/sbin/sh' \
            "properties() { '" \
            'kernel.string=5.4.302-edwin-star-260927-qgqi+ BakaSU for Xiaomi 11 Ultra' \
            'do.devicecheck=1' \
            'do.modules=0' \
            'do.systemless=0' \
            'do.cleanup=1' \
            'do.cleanuponabort=0' \
            'device.name1=star' \
            'device.name2=mars' \
            'device.name3=' \
            'device.name4=' \
            'device.name5=' \
            'supported.versions=' \
            'supported.patchlevels=' \
            'supported.vendorpatchlevels=' \
            "'; } # end properties" \
            '' \
            'BLOCK=boot;' \
            'IS_SLOT_DEVICE=1;' \
            'RAMDISK_COMPRESSION=auto;' \
            'PATCH_VBMETA_FLAG=auto;' \
            '. tools/ak3-core.sh;' \
            'split_boot;' \
            'flash_boot;' \
            > "$AK3_DIR/anykernel.sh"
          
          chmod +x "$AK3_DIR/anykernel.sh"
          cd $AK3_DIR
          zip -r9 "../${{ env.DEVICE_CODENAME }}-BakaSU-${TIME}.zip" ./*
          sha256sum "../${{ env.DEVICE_CODENAME }}-BakaSU-${TIME}.zip" > "../SHA256SUMS.txt"
          cat ../SHA256SUMS.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_bakasu
          path: |
            ${{ env.DEVICE_CODENAME }}-BakaSU-*.zip
            SHA256SUMS.txt

      - name: Upload build.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build_log
          path: kernel/build.log
          if-no-files-found: ignore

      - name: Optional Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bakasu_${{ github.run_number }}
          name: "BakaSU Kernel (LLVM 17.0.6)"
          body: |
            ## 测试内核 - BakaSU 集成版
            - 内核版本：5.4.302
            - 编译工具链：Clang 17.0.6 + LLD 17.0.6
            - LOCALVERSION：`-edwin-star-260927-qgqi`
            - BakaSU commit：${{ env.BAKASU_COMMIT }}
            - BakaSU 版本：${{ env.BAKASU_VERSION }}
            - 刷机有风险，请备份原 boot 分区
          files: |
            ${{ env.DEVICE_CODENAME }}-BakaSU-*.zip
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
